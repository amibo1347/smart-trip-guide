server:
  # 포트 우선순위: PORT(클라우드 플랫폼 주입) → SERVER_PORT → 8082(로컬 기본).
  # Railway/Render 등은 PORT 를 자동 주입하므로 별도 설정 없이 그 포트로 바인딩된다.
  port: ${PORT:${SERVER_PORT:8082}}

spring:
  application:
    name: smart-travel-planner

  datasource:
    # 로컬 기본값은 docker-compose MySQL(호스트 3308). 운영은 DB_* 환경변수로 오버라이드.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:smart_travel}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마 소유권은 Flyway에 있음. JPA는 엔티티-스키마 정합성만 검증.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # 클라우드 배포 시 DB가 앱보다 늦게 준비될 수 있으므로 즉시 크래시 대신 재시도.
    connect-retries: 10
    connect-retries-interval: 5

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB        # 기록 사진 1장 상한
      max-request-size: 12MB

  # 세션을 DB(JDBC)에 저장 → 백엔드 재시작에도 로그인 유지. 스키마는 Flyway(V10)가 관리.
  session:
    store-type: jdbc
    timeout: 14d
    jdbc:
      initialize-schema: never

# AI 일정 생성 (Google Gemini). 키는 .env 의 GEMINI_API_KEY 로 주입(없으면 AI 기능만 비활성).
# 모델 기본값은 team 프로젝트와 동일한 무료 모델. GEMINI_MODEL 로 변경 가능(예: gemini-2.5-flash).
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}

# 기록 사진 저장 위치(서버 로컬 파일). /uploads/** 로 정적 서빙. 운영은 UPLOAD_DIR 로 오버라이드.
app:
  upload-dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.jdbc.core: debug
