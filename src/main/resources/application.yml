server:
  # 8080/8081이 로컬 타 프로세스에 점유되어 8082 사용. 운영은 SERVER_PORT로 오버라이드.
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: smart-travel-planner

  datasource:
    # 로컬 기본값은 docker-compose MySQL(호스트 3308). 운영은 DB_* 환경변수로 오버라이드.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:smart_travel}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마 소유권은 Flyway에 있음. JPA는 엔티티-스키마 정합성만 검증.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

# AI 일정 생성 (Google Gemini). 키는 .env 의 GEMINI_API_KEY 로 주입(없으면 AI 기능만 비활성).
# 모델 기본값은 team 프로젝트와 동일한 무료 모델. GEMINI_MODEL 로 변경 가능(예: gemini-2.5-flash).
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.jdbc.core: debug
