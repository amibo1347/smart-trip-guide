# Google 로그인 — 'google' 프로필에서만 로드. (dev.ps1이 .env에 키가 있으면 자동 활성화)
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
