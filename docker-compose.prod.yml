# =====================================================================
# 운영 배포용 (Oracle Cloud Always Free VM 등 단일 서버).
#  - app   : 이 리포의 Dockerfile 로 빌드(프론트 포함 단일 jar)
#  - mysql : 데이터는 named volume 에 영구 보관
#  - caddy : 리버스 프록시 + Let's Encrypt 자동 HTTPS (PWA 필수)
# 사용: cp .env.prod.example .env  → 값 채우고  → docker compose -f docker-compose.prod.yml up -d --build
# =====================================================================

services:
  mysql:
    image: mysql:8.4
    container_name: stp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  app:
    build: .                 # 리포 루트의 Dockerfile 사용
    container_name: stp-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # DB 준비된 뒤 기동
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8082"
      TZ: Asia/Seoul
      # ── DB (같은 compose 네트워크: host=서비스명 mysql, port=내부 3306) ──
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      # ── AI ──
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      # ── 사진 영구 보관(named volume) ──
      UPLOAD_DIR: /data/uploads
      # ── CORS: 내 도메인 허용(POST 요청 Origin 검사 통과) ──
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      # ── 소셜 로그인(선택) — 비우면 비활성, 이메일 로그인은 정상 ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
    volumes:
      - uploads-data:/data/uploads
    expose:
      - "8082"             # 외부 공개 X — caddy 만 접근
    networks: [internal]

  caddy:
    image: caddy:2
    container_name: stp-caddy
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"            # Let's Encrypt 검증 + http→https 리다이렉트
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data    # 발급된 인증서 보관(재시작에도 유지)
      - caddy-config:/config
    networks: [internal]

networks:
  internal:

volumes:
  mysql-data:
  uploads-data:
  caddy-data:
  caddy-config:
