plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.travel'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 인증/인가 + 소셜 로그인(OAuth2). BCrypt(spring-security-crypto)는 security starter에 포함.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ===== 프론트엔드(React PWA) 통합 빌드 =====
// frontend/ 를 빌드해 Spring 정적 리소스로 번들 → 백엔드(8082) 한 곳에서 화면까지 서빙.
def frontendDir = file("$projectDir/frontend")
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
def npmCmd = isWindows ? ['cmd', '/c', 'npm'] : ['npm']

tasks.register('frontendInstall', Exec) {
	workingDir frontendDir
	inputs.file("$frontendDir/package.json")
	outputs.dir("$frontendDir/node_modules")
	commandLine(npmCmd + ['install'])
}

tasks.register('frontendBuild', Exec) {
	dependsOn 'frontendInstall'
	workingDir frontendDir
	inputs.dir("$frontendDir/src")
	inputs.file("$frontendDir/index.html")
	inputs.file("$frontendDir/vite.config.js")
	outputs.dir("$frontendDir/dist")
	commandLine(npmCmd + ['run', 'build'])
}

tasks.register('copyFrontend', Copy) {
	dependsOn 'frontendBuild'
	from "$frontendDir/dist"
	into "$projectDir/src/main/resources/static"
}

// 백엔드 리소스 처리 전에 프론트 빌드 산출물을 static 으로 복사
tasks.named('processResources') {
	dependsOn 'copyFrontend'
}
