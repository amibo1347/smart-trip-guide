services:
  mysql:
    image: mysql:8.4
    container_name: smart-travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-smart_travel}
      TZ: Asia/Seoul
    # 호스트 3308 -> 컨테이너 3306. 로컬 MySQL80(3306), 타 프로젝트(beauty-mysql 3307)와 충돌 회피.
    ports:
      - "${DB_PORT:-3308}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
